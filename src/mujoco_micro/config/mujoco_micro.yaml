mujoco_micro_node:
  ros__parameters:
    control:
      profile_name: "mujoco_validated_hardware_roll"
      period_s: 0.003
      # 保留当前仓库行为：实机输出默认开启。首次替换后建议命令行 dry_run:=true 验证。
      dry_run: false
      joint_control_enable: true
      balance_control_enable: true

    topics:
      imu_read: "/ecat/sn1966149/app1/read"
      rc_read: "/ecat/sn2228252/app1/read"
      left_joint_a_read: "/ecat/sn2228252/app2/read"
      left_joint_a_write: "/ecat/sn2228252/app2/write"
      left_joint_b_read: "/ecat/sn2228252/app3/read"
      left_joint_b_write: "/ecat/sn2228252/app3/write"
      left_wheel_read: "/ecat/sn2228252/app4/read"
      left_wheel_write: "/ecat/sn2228252/app4/write"
      right_joint_a_read: "/ecat/sn2228252/app5/read"
      right_joint_a_write: "/ecat/sn2228252/app5/write"
      right_joint_b_read: "/ecat/sn2228252/app6/read"
      right_joint_b_write: "/ecat/sn2228252/app6/write"
      right_wheel_read: "/ecat/sn2228252/app7/read"
      right_wheel_write: "/ecat/sn2228252/app7/write"
      debug: "/vmc/debug"

    five_bar:
      l1_m: 0.0804
      l2_m: 0.1200
      l3_m: 0.1200
      l4_m: 0.0804
      l5_m: 0.0700
      singularity_epsilon: 1.0e-5
      reachability_epsilon: 1.0e-7

    leg:
      target_x_m: 0.035
      # height.enable=false 时使用的固定高度；启用高度控制时由 left_y 动态覆盖。
      target_y_m: 0.120

    height:
      enable: true
      # left_y=-1/0/+1 分别对应 min_m/center_m/max_m。
      center_m: 0.120
      min_m: 0.090
      max_m: 0.160
      target_slew_rate_mps: 0.060
      rc_deadband: 0.08
      rc_sign: 1.0

    vmc:
      total_supported_mass_kg: 2.8
      left_load_fraction: 0.5
      right_load_fraction: 0.5
      kx_n_per_m: 10.0
      ky_n_per_m: 60.0
      dx_ns_per_m: 10.0
      dy_ns_per_m: 10.0
      gravity_compensation: true
      horizontal_pitch_gravity_compensation: false
      joint_torque_limit_nm: 1.0

    joint_state:
      velocity_filter_hz: 25.0

    joint_mit:
      kp: 7.0
      kd: 0.28
      hard_torque_limit_nm: 1.5
      motor_position_limit_rad: 12.5
      max_arm_joint_error_rad: 0.70
      max_runtime_joint_error_rad: 1.20

    leg_positioning:
      balance_wait_for_leg_ready: true
      ready_joint_error_rad: 0.10
      ready_joint_velocity_rad_s: 0.30
      ready_dwell_s: 0.30

    joint_calibration:
      left_a:
        motor_zero_rad: -0.340847969
        joint_zero_rad: 3.504545690
        motor_sign: -1.0
        ratio: 1.0
        torque_sign: -1.0
      left_b:
        motor_zero_rad: -0.629243851
        joint_zero_rad: 0.899913073
        motor_sign: -1.0
        ratio: 1.0
        torque_sign: -1.0
      right_a:
        motor_zero_rad: -0.912680626
        joint_zero_rad: 2.241679670
        motor_sign: 1.0
        ratio: 1.0
        torque_sign: 1.0
      right_b:
        motor_zero_rad: -0.602540970
        joint_zero_rad: -0.362952948
        motor_sign: 1.0
        ratio: 1.0
        torque_sign: 1.0

    imu:
      # gravity: 以世界重力方向定义绝对水平姿态，不再把拨杆1时的姿态记为零点。
      # relative: 保留旧行为，拨杆1记录当前四元数作为相对零点。
      reference_mode: "gravity"
      # orientation 推荐：使用 IMU 内部融合四元数提取重力方向；
      # accelerometer 备用：直接使用 linear_acceleration，易受车辆加减速影响。
      gravity_source: "orientation"
      mount_roll_deg: 0.0
      mount_pitch_deg: 0.0
      gravity_accel_sign: 1.0
      gravity_filter_hz: 10.0
      gravity_norm_min_mps2: 7.8
      gravity_norm_max_mps2: 11.8
      gravity_ready_dwell_s: 0.20
      gravity_timeout_s: 0.20

      pitch_axis: "pitch"
      pitch_rate_axis: "y"
      pitch_sign: 1.0
      pitch_rate_sign: 1.0

      # gravity 模式下 Pitch/Roll 都使用同一个绝对重力参考。
      roll_axis: "roll"
      roll_rate_axis: "x"
      roll_sign: 1.0
      roll_rate_sign: 1.0

      yaw_rate_axis: "z"
      yaw_rate_sign: 1.0

    safety:
      require_rc: true
      imu_timeout_s: 0.05
      motor_timeout_s: 0.05
      rc_timeout_s: 0.20
      arm_max_tilt_deg: 30.0
      arm_max_pitch_rate_rad_s: 0.30
      fall_cutoff_deg: 35.0
      arm_max_roll_deg: 10.0
      arm_max_roll_rate_rad_s: 0.40
      fall_cutoff_roll_deg: 35.0
      calibrate_switch_value: 1
      arm_switch_value: 3
      disable_switch_value: 2

    balance:
      mode: "cascade"
      wheel_radius_m: 0.030
      motor_position_wrap_half_range: 3.141592653589793
      left_encoder_sign: 1.0
      right_encoder_sign: -1.0
      pitch_position_compensation_sign: 1.0
      pitch_rate_compensation_sign: 1.0
      output_gain_sign: -1.0
      left_motor_sign: -1.0
      right_motor_sign: 1.0
      torque_limit_each_nm: 0.3
      hard_torque_limit_each_nm: 0.45
      pitch_filter_hz: 40.0
      pitch_rate_filter_hz: 25.0
      wheel_velocity_filter_hz: 30.0
      position_velocity_filter_hz: 12.0
      outer_velocity_filter_hz: 8.0
      velocity_blend: 0.0

    policy:
      enable: true
      # 空字符串表示使用随包安装的 share/mujoco_micro/models/policy.onnx。
      model_path: ""
      # 这两个数值必须与 Isaac Lab 训练/导出约定保持一致。
      residual_scale_nm: 0.060
      # 基线与残差叠加后的工作限幅；必须不小于基线限幅且不超过硬限幅。
      final_torque_limit_each_nm: 0.3

    # 拨杆3后的第一阶段：从无控制折叠姿态扶正、对齐质心-轮轴重力线并伸腿。
    # 成功后自动无冲击切换到上面的常规串级控制器 + policy.onnx。
    recovery:
      enable: true
      # 空字符串表示使用随包安装的 share/mujoco_micro/models/recovery_policy.onnx。
      model_path: ""
      policy_period_s: 0.010

      # recovery 独立启动/失败边界，不放宽 NORMAL 阶段的 fall_cutoff。
      start_max_pitch_deg: 35.0
      start_max_pitch_rate_rad_s: 4.0
      terminate_pitch_deg: 70.0
      max_duration_s: 8.0
      max_wheel_travel_m: 0.80

      wheel_torque_limit_nm: 0.45
      # Recovery 动作是训练轮角坐标中的广义力矩，因此按 encoder_sign 映射。
      # 若单独做低力矩方向试验确认整体相反，只改 output_sign 为 -1。
      wheel_output_sign: 1.0
      # 防止 ONNX 首帧饱和时瞬间施加 0.45 Nm；约 0.225 s 才能从零升到满量程。
      wheel_torque_slew_nm_s: 2.0
      height_min_m: 0.012
      height_max_m: 0.130
      goal_height_m: 0.120
      height_rate_center_mps: 0.040
      height_rate_span_mps: 0.100
      height_rate_min_mps: -0.040
      height_rate_max_mps: 0.140
      leg_angle_limit_deg: 35.0
      leg_angle_rate_deg_s: 120.0
      tilt_unlock_min_height_m: 0.020
      tilt_unlock_full_height_m: 0.070

      alignment_unlock_deg: 5.0
      alignment_relock_deg: 8.0
      alignment_unlock_dwell_s: 0.10
      success_pitch_deg: 5.0
      success_alignment_deg: 5.0
      success_pitch_rate_rad_s: 0.35
      success_height_tolerance_m: 0.010
      success_wheel_velocity_mps: 0.30
      success_dwell_s: 0.15
      pitch_rate_filter_hz: 1.675

      # 训练时的显式关节力矩 PD；代码会先限幅再作为 MIT 前馈力矩发送。
      joint_kp: 7.0
      joint_kd: 0.28
      joint_torque_limit_nm: 1.5
      left_alpha0: 2.4430524286
      left_beta0: 0.6977234730
      right_alpha0: 2.4438691429
      right_beta0: 0.6985402266
      hip_pivot_height_m: 0.1530
      chassis_com_height_m: 0.1895
      handoff_blend_s: 0.10

    rc:
      velocity_command_enable: true
      max_target_velocity_mps: 0.70
      forward_sign: 1.0
      deadband: 0.08
      velocity_slew_rate_mps2: 1.0

    cascade:
      attitude_k_pitch: 2.3
      attitude_k_pitch_rate: 0.22
      position_kp_rad_per_m: 0.4
      velocity_kd_rad_per_mps: 0.26
      position_ki_rad_per_m_s: 0.0
      integral_enable: false
      integral_limit_m_s: 0.20
      position_to_pitch_sign: -1.0
      pitch_limit_deg: 8.0
      pitch_slew_rate_deg_s: 30.0
      position_error_limit_m: 0.50
      velocity_error_limit_mps: 0.80
      arm_bumpless: true
      pitch_trim_deg: 0.0

    yaw:
      enable: true
      max_target_rate_rad_s: 3.0
      rc_sign: -1.0
      rate_slew_rad_s2: 10.0
      kp_each_nm_per_rad_s: 0.1
      kd_each_nm_per_rad_s2: 0.0
      deadband_rad_s: 0.02
      rate_filter_hz: 15.0
      accel_filter_hz: 8.0
      torque_limit_each_nm: 0.025
      torque_slew_nm_s: 0.50
      output_sign: 1.0

    # 新增且独立的 Roll 控制。执行器是左右腿高度差，不占用轮毂 Yaw 差动扭矩。
    # 为保证替换后不改变原有行为，默认 false；完成悬架方向测试后改为 true。
    roll:
      enable: true
      trim_deg: 0.0

      # Roll PD 输出“左右两腿轮心 Y 目标的总差值”。
      kp_leg_difference_m_per_rad: 0.9
      kd_leg_difference_m_per_rad_s: 0.008

      # |left_target_y - right_target_y| 的最大值；0.016 表示总差最多 16 mm，单腿各偏 8 mm。
      max_leg_difference_m: 0.25
      leg_difference_slew_rate_mps: 0.10

      # right_x 满杆对应的最大 Roll 目标角和目标角变化速度。
      max_target_roll_deg: 10.0
      target_slew_rate_deg_s: 20.0
      rc_deadband: 0.08

      # 只改变遥控器 right_x 的方向。
      rc_sign: 1.0
      # 只改变 Roll 控制器左右腿修正方向。修正越修越歪时改为 -1.0。
      output_sign: 1.0

      angle_filter_hz: 15.0
      rate_filter_hz: 10.0

    auto_trim:
      enable: false
      gain_rad_per_m_s: 0.020
      limit_deg: 4.0
      position_deadband_m: 0.05
      velocity_limit_mps: 0.25
      pitch_rate_limit_rad_s: 0.20
      safe_pitch_deg: 6.0
      max_position_error_m: 0.70
      dwell_s: 0.25
      max_rate_deg_s: 0.10

    stiction:
      enable: false
      velocity_limit_mps: 0.015
      pitch_rate_limit_rad_s: 0.08
      position_error_m: 0.008
      command_min_total_nm: 0.002
      compensation_each_nm: 0.005

    lqr:
      gain_scale: 1.0
      k_pitch: -2.0
      k_pitch_rate: -0.10
      k_position: -0.55
      k_velocity: -0.13

    model:
      body_mass_kg: 2.54
      body_pitch_inertia_kgm2: 0.0
      body_com_x_m: 0.035
      body_com_y_m: -0.065
      wheel_mass_each_kg: 0.13
      wheel_inertia_each_kgm2: 0.0
      track_width_m: 0.20
